[project]
name = "rheon"
version = "0.1.0"
description = "Synthetic concept-drift event-log generation for process mining"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["process-mining", "concept-drift", "event-log", "xes", "synthetic-data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pm4py>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rheon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
