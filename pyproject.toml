[project]
name = "rheon"
version = "0.1.0"
description = "Synthetic multi-perspective concept drift log generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pm4py>=2.7",
]

[dependency-groups]
dev = [
    "hypothesis>=6.148.0",
    "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rheon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
